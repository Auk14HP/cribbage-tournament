name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npm run e2e
            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: playwright-traces
                  path: test-results/

    # Builds main for GitHub Pages once the checks above pass. Pull requests stop at the checks: skipping this job
    # skips the deploy after it too.
    build-pages:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: check
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: read
        # Named for the run attempt, so a re-run that builds again deploys its own artifact, not an earlier attempt's.
        # Handed on as an output, so the deploy uses the name this job uploaded under.
        env:
            ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        outputs:
            artifact-name: ${{ env.ARTIFACT_NAME }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run build
            - uses: actions/configure-pages@v6
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: dist
                  name: ${{ env.ARTIFACT_NAME }}

    # Publishes the build in a job of its own: deploy-pages lists the run's artifacts as soon as it starts, and
    # straight after the upload that list can still be empty. Starting a new job gives the upload time to appear in it.
    deploy:
        needs: build-pages
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        concurrency:
            group: pages
            cancel-in-progress: false
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5
              with:
                  # Read from build-pages, not worked out again: "Re-run failed jobs" re-runs only this job, under a new
                  # attempt number, and it must still find the artifact build-pages uploaded.
                  artifact_name: ${{ needs.build-pages.outputs.artifact-name }}
